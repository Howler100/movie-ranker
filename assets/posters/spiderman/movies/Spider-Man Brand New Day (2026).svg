  <text x="300" y="460" font-family="Georgia, serif" font-size="34" fill="#e8e8e8"
        text-anchor="middle" letter-spacing="4">BRAND NEW DAY</text>
  <text x="300" y="820" font-family="Arial, sans-serif" font-size="26" fill="#ffcc00"
        text-anchor="middle" letter-spacing="2">COMING 2026</text>
  <text x="300" y="860" font-family="Arial, sans-serif" font-size="18" fill="#bbbbbb"
        text-anchor="middle">POSTER PLACEHOLDER</text>
