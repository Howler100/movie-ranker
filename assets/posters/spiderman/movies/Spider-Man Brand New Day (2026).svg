<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a0d0d"/>
      <stop offset="100%" stop-color="#1a0303"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <g stroke="#000" stroke-width="2" opacity="0.25">
    <line x1="0" y1="0" x2="600" y2="900"/>
    <line x1="600" y1="0" x2="0" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="0" y2="300"/>
    <line x1="450" y1="0" x2="600" y2="300"/>
    <line x1="150" y1="900" x2="0" y2="600"/>
    <line x1="450" y1="900" x2="600" y2="600"/>
  </g>
  <text x="300" y="400" font-family="Georgia, serif" font-size="54" font-weight="bold"
