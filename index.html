<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Movie Ranker</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 1px;
      text-align: center;
    }
    .choices, .subchoices {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1.5rem;
    }
    /* BUTTON RESET */
    .btn {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    /* LOGO IMAGES */
    .btn img {
      display: block;
      width: 400px;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    /* CATEGORY TEXT BUTTONS */
    .btn-text {
      padding: 0.75rem 1.5rem;
      border: 2px solid #fff;
      border-radius: 4px;
      background: transparent;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      text-transform: capitalize;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-text:hover {
      background: rgba(255,255,255,0.1);
      transform: scale(1.05);
    }

    /* POSTER STYLE MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 1000;
    }
    .modal-card {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 1.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .modal-card h1 {
      font-size: 1.4rem;
      margin-bottom: 1.25rem;
    }
    .modal-options {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .modal-option {
      background: transparent;
      border: 2px solid transparent;
      border-radius: 6px;
      padding: 0;
      width: 150px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .modal-option:hover {
      transform: scale(1.04);
      border-color: #fff;
    }
    .modal-option img {
      width: 100%;
      display: block;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <h1>Choose Your Universe</h1>
  <div id="franchises" class="choices">

    <!-- Marvel Studios Button -->
    <button class="btn" data-franchise="mcu" aria-label="Marvel Cinematic Universe">
      <img src="assets/logos/marvel-studios-logo.jpeg" alt="Marvel Studios Logo"/>
    </button>

     <!-- Marvel TV Button -->
    <button class="btn" data-franchise="mcutv" aria-label="Marvel TV">
      <img src="assets/logos/marvel-television-logo.jpg" alt="Marvel TV Logo">
    </button>
  
   <!-- Star Wars Button -->
    <button class="btn" data-franchise="starwars" aria-label="Star Wars">
      <img src="assets/logos/star-wars-logo.jpg" alt="Star Wars Logo"/>
    </button>
  
    <!-- Mission Impossible Button -->
    <button class="btn" data-franchise="missionimpossible">
      <img src="assets/logos/mission-impossible-logo.jpg" alt="Mission Impossible Logo">
    </button>

    <!-- Harry Potter Button -->
    <button class="btn" data-franchise="harrypotter">
      <img src="assets/logos/harry-potter-ww-logo.png" alt="Harry Potter Logo" />
    </button>

    <!-- Spider-Man Button -->
    <button class="btn" data-franchise="spiderman" aria-label="Spider-Man">
      <img src="assets/logos/spider-man-logo.jpg" alt="Spider-Man Logo"/>
    </button>

    <!-- Pixar Button -->
    <button class="btn" data-franchise="pixar" aria-label="Pixar">
      <img src="assets/logos/pixar-logo.jpg" alt="Pixar Logo"/>
    </button>

    <!-- Christopher Nolan Button -->
    <button class="btn" data-franchise="nolan" aria-label="Christopher Nolan">
      <img src="assets/logos/nolan-logo.jpeg" alt="Christopher Nolan Logo"/>
    </button>

    <!-- Pirates of the Caribbean Button -->
    <button class="btn" data-franchise="pirates" aria-label="Pirates of the Caribbean">
      <img src="assets/logos/pirates-logo.jpg" alt="Pirates of the Caribbean Logo"/>
    </button>

  </div>
  
  <div id="categories" class="subchoices" style="display:none;">
    <!-- category buttons will be injected here -->
  </div>

  <div id="poster-style-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h1>Choose a Poster Style</h1>
      <div id="poster-style-options" class="modal-options"></div>
    </div>
  </div>

  <script>
    // define which categories exist for each franchise
    const available = {
      starwars:          ['movies'],
      mcu:               ['movies'],
      missionimpossible: ['movies'],
      harrypotter:       ['movies'],
      spiderman:         ['movies'],
      mcutv:             ['tv'],
      pixar:             ['movies'],
      nolan:             ['movies'],
      pirates:           ['movies']
    };

    // franchises that let the user pick between alternate poster collections
    const posterSets = {
      pirates: [
        { key: 'mp',   label: 'Movie Posters',
          preview: 'assets/posters/pirates/movies/mp/Curse of the Black Pearl (2003).webp' },
        { key: 'ship', label: 'Stylized Ships',
          preview: 'assets/posters/pirates/movies/ship/Curse of the Black Pearl (2003).webp' }
      ],
      harrypotter: [
        { key: 'current',     label: 'Current',
          preview: 'assets/posters/harrypotter/movies/Harry Potter and the Prisoner of Azkaban (2004).png' },
        { key: 'illustrated', label: 'Illustrated',
          preview: 'assets/posters/harrypotter/movies/illustrated/Harry Potter and the Prisoner of Azkaban (2004).webp' },
        { key: 'painted',     label: 'Painted',
          preview: 'assets/posters/harrypotter/movies/painted/Harry Potter and the Prisoner of Azkaban (2004).png' },
        { key: 'minimalist',  label: 'Minimalist',
          preview: 'assets/posters/harrypotter/movies/minimalist/Harry Potter and the Prisoner of Azkaban (2004).webp' }
      ]
    };

    const franchises        = document.getElementById('franchises');
    const categories        = document.getElementById('categories');
    const posterModal       = document.getElementById('poster-style-modal');
    const posterModalOptions = document.getElementById('poster-style-options');
    let chosenFranchise = null;

    function goToRanker(theme, category) {
      const sets = posterSets[theme];
      if (sets) {
        posterModalOptions.innerHTML = '';
        sets.forEach(set => {
          const b = document.createElement('button');
          b.className = 'modal-option';
          b.dataset.posterset = set.key;
          b.dataset.theme = theme;
          b.dataset.category = category;
          b.title = set.label;
          b.innerHTML = `<img src="${set.preview}" alt="${set.label}"/>`;
          posterModalOptions.appendChild(b);
        });
        posterModal.style.display = 'flex';
      } else {
        window.location.href =
          `movie-ranker.html?theme=${theme}&category=${category}`;
      }
    }

    posterModalOptions.addEventListener('click', e => {
      const btn = e.target.closest('button[data-posterset]');
      if (!btn) return;
      window.location.href =
        `movie-ranker.html?theme=${btn.dataset.theme}&category=${btn.dataset.category}&posterSet=${btn.dataset.posterset}`;
    });

    // click the backdrop to dismiss without choosing
    posterModal.addEventListener('click', e => {
      if (e.target === posterModal) posterModal.style.display = 'none';
    });

    franchises.addEventListener('click', e => {
      const btn = e.target.closest('button[data-franchise]');
      if (!btn) return;
      chosenFranchise = btn.dataset.franchise;
      const cats = available[chosenFranchise] || ['movies'];

      if (cats.length === 1) {
        // skip sub-step
        goToRanker(chosenFranchise, cats[0]);
      } else {
        // show category choices
        categories.innerHTML = `<h1>2) Choose a Category</h1>`;
        cats.forEach(cat => {
          const b = document.createElement('button');
          b.className = 'btn-text';
          b.dataset.category = cat;
          b.textContent = cat;
          categories.appendChild(b);
        });
        categories.style.display = 'flex';
      }
    });

    categories.addEventListener('click', e => {
      const btn = e.target.closest('button[data-category]');
      if (!btn) return;
      const cat = btn.dataset.category;
      goToRanker(chosenFranchise, cat);
    });
  </script>
</body>
</html>
